<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼控制台</title>
<style>
  :root {
    --bg:#0f1420; --card:#171e2e; --line:#253047; --text:#dbe4f5; --sub:#8b9bb8;
    --accent:#5b9cff; --ok:#3ddc97; --warn:#ffb347; --bad:#ff5d5d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  .app{display:flex;min-height:100vh}
  .side{width:196px;flex:none;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;background:#0d121c}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .brand .logo{font-size:22px;line-height:1}
  .sidegroup{font-size:11px;color:#5d6c88;letter-spacing:1.5px;padding:14px 10px 5px}
  .sidetab{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--sub);font-size:13.5px;margin-bottom:2px}
  .sidetab:hover{background:#18202e;color:var(--text)}
  .sidetab.active{background:#1e2a3d;color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
  .sidetab{cursor:grab}
  .sidetab.dragover{outline:2px dashed var(--accent);outline-offset:-2px}
  .modecard{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s}
  .modecard:hover{border-color:#2c3c58}
  .modecard.on{border-color:var(--accent);background:#16233a}
  .modecard b{display:block;margin-bottom:4px}
  .sidetab .ic{width:16px;text-align:center;opacity:.85}
  .sidefoot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--line);font-size:11px;line-height:1.7;color:#5d6c88}
  .stage{flex:1;min-width:0;padding:20px 24px 48px}
  @media (max-width:760px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}.brand{display:none}.sidegroup{display:none}.sidefoot{display:none}.stage{padding:12px}}
  main{padding:0;max-width:1280px;margin:0 auto}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .overview-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:stretch}
  .overview-grid .card{height:100%;min-height:220px}
  .plugin-list{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .tokrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
  .tokstat{background:#131a26;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;min-height:96px;display:flex;flex-direction:column;justify-content:center}
  .tokstat span{color:var(--sub);font-size:12px}
  .tokstat b{font-size:22px;line-height:1.2;margin-top:6px;font-weight:600}
  @media (max-width:900px){.tokrow{grid-template-columns:repeat(2,minmax(0,1fr))}.plugin-list{grid-template-columns:1fr}}
  @media (max-width:760px){.tokrow{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s}
  .card:hover{border-color:#2c3c58}
  table tr:hover td{background:#141d2b}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#26324a;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  .card h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:500}
  .kv{display:flex;justify-content:space-between;padding:3px 0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .on{background:var(--ok)} .off{background:var(--bad)}
  button{background:#22304a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06101f;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .switch{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
  .switch:last-child{border-bottom:0}
  .sw{width:42px;height:22px;border-radius:12px;background:#2b364e;position:relative;cursor:pointer;transition:.2s;flex:none}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#7d8aa5;transition:.2s}
  .sw.on{background:var(--ok)} .sw.on::after{left:23px;background:#06281a}
  pre{background:#0b0f18;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:560px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
  textarea{width:100%;min-height:420px;background:#0b0f18;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.7;resize:vertical}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .thumbs img{width:100%;aspect-ratio:1;object-fit:contain;background:#0b0f18;border-radius:8px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--sub);font-weight:500}
  th.thsort{cursor:pointer;user-select:none;white-space:nowrap}
  th.thsort:hover{color:var(--text)}
  th.thsort.cur{color:#8fb8ff}
  .muted{color:var(--sub);font-size:12.5px}
  .in{color:#7fd3a8} .out{color:#8ab7ff}
  input,select{background:#0b0f18;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
  .toast{position:fixed;right:20px;bottom:20px;background:#22304a;border:1px solid var(--accent);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .hidden{display:none}
  .stream{max-height:560px;overflow:auto}
  .stream div{padding:4px 6px;border-bottom:1px solid #0e1420}
  .stream .t{color:var(--sub);font-size:12px;margin-right:8px}
  .mtext{white-space:pre-wrap;word-break:break-word}
  .mtext.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .expand{color:var(--accent);font-size:12px;cursor:pointer;margin-left:4px;text-decoration:none}
  .msgimg{max-width:150px;max-height:150px;border-radius:8px;border:1px solid var(--line);margin:4px 0;display:inline-block;vertical-align:middle;cursor:zoom-in}
  .tag{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:6px}
  /* 快捷设置 */
  .qrow{display:flex;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:6px}
  .qrow:hover{background:#182135}
  .qlabel{width:180px;flex-shrink:0}
  .qctrl{flex:1;display:flex;align-items:center;gap:8px}
  .qstar{font-size:17px;line-height:1;padding:2px 8px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer}
  .qstar:hover{border-color:var(--line);background:#1e2a3d}
  .qgroup{margin:16px 0 2px}
  .qtag{font-size:11px;color:#7b8ea8;letter-spacing:1px}
  .qsave{font-size:11px;color:#5aa469;white-space:nowrap}
  .qsave a{color:#7fb0ff}
  /* 插件折叠卡 */
  .plug{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .plug.open{border-color:#3a5a86}
  .plug.off{opacity:.6}
  .plughead{display:flex;gap:12px;align-items:center;padding:10px 12px;background:#141c2a}
  .plugmain{flex:1;min-width:0}
  .plugacts{display:flex;gap:6px;flex-shrink:0}
  .plugacts button{padding:4px 9px;font-size:12px}
  .plugacts .danger{color:var(--bad)}
  .plugbody{padding:6px 14px 14px;border-top:1px solid var(--line);background:#0f1520}
  .badge.off{background:#3a2530;color:#ff9c9c;font-size:10px;padding:1px 5px;border-radius:4px}
  /* 首页 */
  .hero{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    background:linear-gradient(120deg,#1b2a44,#172033 60%,#1a2436);border:1px solid var(--line);
    border-radius:14px;padding:20px 22px}
  .hero-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  .hero-sub{color:var(--sub);font-size:12.5px;margin-top:6px}
  .hero-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .quickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
  .qcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 16px 18px;cursor:pointer;transition:.15s}
  .qcard:hover{border-color:var(--accent);transform:translateY(-1px)}
  .qcard .qt{font-weight:600;font-size:14px}
  .qcard .qs{color:var(--sub);font-size:12px;margin-top:5px}
  .qcard .arrow{position:absolute;right:14px;top:14px;color:#5d6c88;font-size:15px}
  .rline{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}
  .rline:last-child{border-bottom:0}
  #clock{color:var(--sub)}
  .tgl{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .tgl input{display:none}
  .tgl span{position:absolute;inset:0;background:#2a3446;border-radius:12px;transition:.18s;cursor:pointer}
  .tgl span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#8a97ad;border-radius:50%;transition:.18s}
  .tgl input:checked+span{background:#2f6f4f}
  .tgl input:checked+span:before{transform:translateX(20px);background:#dff5e8}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .stat{display:flex;gap:8px;align-items:baseline;background:#131a26;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
  .stat b{font-size:18px}
  .avatar{width:28px;height:28px;border-radius:50%;background:#1e2a3d;color:#9fb3d1;display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:8px;flex:none}
  .rowline{display:flex;align-items:center;padding:7px 4px;border-bottom:1px solid #0e1420}
  .nlist{overflow:hidden}
  .nlist.open{max-height:540px;overflow:auto}
  .pcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#111827}
  .mini{padding:2px 8px;font-size:12px;border-radius:6px;margin-left:6px;background:#1b2333;border:1px solid var(--line)}
  .mini.on{background:#243a5c;border-color:var(--accent);color:#cfe0ff}
  .seg{display:inline-flex;background:#101826;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg button{background:transparent;border:0;border-radius:8px;padding:5px 13px;color:var(--sub);font-size:13px}
  .seg button.on{background:#22304a;color:var(--text);font-weight:600}
  button.danger{background:#3a1d24;border-color:#5a2a33;color:#ffb3bd}
  button.danger:hover{border-color:#ff5d5d}
  button:disabled{opacity:.45;cursor:not-allowed}
  .page-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
  .page-head h2{margin:0;font-size:19px;font-weight:600}
  .page-head .sub{color:var(--sub);font-size:12.5px}
  .badge{display:none;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;text-align:center;margin-left:auto}
  .badge.show{display:inline-block}
  @media (max-width:760px){
    .app{flex-direction:column}
    .side{width:auto;height:auto;position:static;flex-direction:column;padding:10px 8px 4px}
    #tabsAll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
    .sidegroup{display:none}
    .sidetab{margin:0;white-space:nowrap;padding:7px 10px}
    .sidefoot{display:none}
    .stage{padding:12px 10px 28px}
    .page-head h2{font-size:17px}
    .grid,.grid2{grid-template-columns:1fr}
    .card{padding:12px}
    table{font-size:12px}
    .stat{padding:6px 10px}
    .modecard{padding:10px}
    textarea{min-height:240px}
  }
.pdot{width:10px;height:10px;border-radius:50%;background:#5a6478;display:inline-block}
  .pdot.ok{background:var(--ok)}
  .pdot.bad{background:#ff7a45}
.mooddrop{border:1px dashed #2a3550;border-radius:10px;padding:10px;margin-bottom:16px}
  .mooddrop .thumbs{max-height:96px;overflow:auto}
  .mooddrop.open .thumbs{max-height:320px}
  .mooddrop img{-webkit-user-drag:none;user-select:none}
  .mooddrop.over{border-color:var(--accent);background:#1a2438}
.memrow{background:#141b29;border:1px solid #1d2740;border-radius:8px;padding:10px;margin-bottom:8px}
  .memrow summary{cursor:pointer}
.timehead{font-size:13px;font-weight:600;color:#8fb8ff;letter-spacing:.4px;margin:10px 0 6px;text-align:inherit}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">🐳</span><div><b>大肥鱼</b><div style="font-size:11px;color:#5d6c88">控制台</div></div></div>
    <div id="tabsAll"></div>
    <div class="sidefoot"><div id="clock"></div><div style="margin-top:6px"><a href="http://127.0.0.1:6185" target="_blank" style="color:#7fb0ff;text-decoration:none">AstrBot 后台 ↗</a></div><div style="margin-top:6px">一条鱼，一个群，<br>吵吵闹闹。</div></div>
  </aside>
  <div class="stage"><div id="pagehead"></div><main id="main"></main></div>
</div>
<div class="toast" id="toast"></div>

<!-- 需要重启时的弹窗 -->
<div id="restartMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;align-items:center;justify-content:center">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;max-width:460px;box-shadow:0 18px 50px rgba(0,0,0,.45)">
    <h3 style="margin:0 0 10px">需要重启才生效</h3>
    <div id="restartMsg" class="muted" style="line-height:1.7;margin-bottom:18px"></div>
    <div class="row" style="justify-content:flex-end">
      <button onclick="closeRestart()">稍后再说</button>
      <button class="primary" id="restartGo" onclick="doRestart()">现在重启</button>
    </div>
    <div id="restartHint" class="muted" style="margin-top:12px;font-size:12px"></div>
  </div>
</div>

<script>
const TAB_GROUPS = [
  ['日常', ['总览', '消息流', '好友', '空间', '音乐', '人设', '表情库', '声音']],
  ['系统', ['管理', '日志', '设置']],
];
const TAB_ICONS = {'总览':'◎','消息流':'▤','音乐':'♫','人设':'✎','表情库':'☺','设置':'⚙','声音':'♪','空间':'▣','会话':'▭','好友':'☰','日志':'▦','管理':'☷'};
const fmt = n => (n===null||n===undefined)?'—':n;
const fmtNum = n => (n===null||n===undefined)?'—':Number(n).toLocaleString('zh-CN');
let follow=true, curLog='astrbot', curTab='总览';
const _tabParam = new URLSearchParams(location.search).get('tab') || decodeURIComponent((location.hash || '').slice(1));
if (_tabParam && TAB_GROUPS[0][1].concat(TAB_GROUPS[1][1]).includes(_tabParam)) curTab = _tabParam;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
async function j(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}

// 需要重启的改动统一走这个弹窗，让用户自己点
function askRestart(reason){
  document.getElementById('restartMsg').textContent = reason || '这项修改要重启才会生效。';
  document.getElementById('restartHint').textContent = '';
  const go = document.getElementById('restartGo');
  go.disabled = false; go.textContent = '现在重启';
  const mask = document.getElementById('restartMask');
  mask.style.display = 'flex';
}
function closeRestart(){ document.getElementById('restartMask').style.display = 'none'; }
async function doRestart(){
  const go = document.getElementById('restartGo');
  const hint = document.getElementById('restartHint');
  go.disabled = true; go.textContent = '重启中…';
  hint.textContent = '正在重启 AstrBot，大约 45 秒，期间机器人不回复。';
  try{ await act('restart_astrbot'); }catch(e){}
  let n = 0;
  const timer = setInterval(async function(){
    n++;
    hint.textContent = '重启中… 已等待 ' + (n*3) + ' 秒';
    try{
      const r = await fetch('/api/status',{cache:'no-store'});
      if(r.ok){
        clearInterval(timer);
        hint.textContent = '已经好了，页面即将刷新。';
        setTimeout(()=>location.reload(), 800);
      }
    }catch(e){}
    if(n > 30){ clearInterval(timer); hint.textContent = '没等到响应，请手动刷新页面。'; go.disabled=false; go.textContent='再试一次'; }
  }, 3000);
}

let dragTab = null;
function favOrder(){
  const base = TAB_GROUPS[0][1];
  try{
    const saved = JSON.parse(localStorage.getItem('menuOrder') || '[]');
    const out = saved.filter(function(t){ return base.includes(t); });
    base.forEach(function(t){ if(!out.includes(t)) out.push(t); });
    return out;
  }catch(e){ return base.slice(); }
}

async function updateBadges(){
  try{
    const d = await j('/api/badges');
    document.querySelectorAll('.badge').forEach(function(el){
      const n = d[el.dataset.badge] || 0;
      el.textContent = n > 99 ? '99+' : String(n);
      el.classList.toggle('show', n > 0);
      if(el.dataset.badge === '日志' && d.last_error) el.title = '最近一条错误：' + d.last_error;
      else if(el.dataset.badge === '空间') el.title = '有草稿等你确认';
      else if(el.dataset.badge === '好友') el.title = '好友和名单';
    });
  }catch(e){}
}

function renderTabs(){
  const mk = t => '<div class="sidetab'+(t===curTab?' active':'')+'" draggable="true" data-t="'+t+'">'
    +'<span class="ic">'+(TAB_ICONS[t]||'·')+'</span>'+t
    +'<span class="badge" data-badge="'+t+'"></span></div>';
  const groups = [['日常', favOrder()], ['系统', TAB_GROUPS[1][1]]];
  document.getElementById('tabsAll').innerHTML = groups.map(function(g){
    return '<div class="sidegroup">'+g[0]+'</div>'+g[1].map(mk).join('');
  }).join('');
  document.querySelectorAll('.sidetab').forEach(function(el){
    el.onclick = function(){
      curTab = el.dataset.t;
      document.querySelectorAll('.sidetab').forEach(function(x){ x.classList.toggle('active', x===el); });
      render();
    };
    el.ondragstart = function(e){
      dragTab = el.dataset.t;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragTab);
    };
    el.ondragover = function(e){ e.preventDefault(); el.classList.add('dragover'); };
    el.ondragleave = function(){ el.classList.remove('dragover'); };
    el.ondrop = function(e){
      e.preventDefault();
      el.classList.remove('dragover');
      const target = el.dataset.t;
      if(!dragTab || dragTab===target) return;
      const order = favOrder();
      const from = order.indexOf(dragTab), to = order.indexOf(target);
      if(from<0 || to<0){ dragTab = null; return; }
      order.splice(from,1); order.splice(to,0,dragTab);
      localStorage.setItem('menuOrder', JSON.stringify(order));
      dragTab = null;
      renderTabs();
    };
  });
  updateBadges();
}
renderTabs();

async function refresh(){
  // 只更新文字，不重建页面，否则会闪
  try{
    const s=await j('/api/status');
    const c=document.getElementById('clock'); if(c) c.textContent=s.time;
    if(curTab==='总览'){
      const h=document.getElementById('heroState');
      if(h){
        const online = s.ports.astrbot && s.ports.snowluma && s.ports.reverse_ws && !!s.login;
        h.textContent = online ? '一切正常' : (s.login ? '有服务离线' : 'QQ 掉线了');
        h.style.color = online ? '' : 'var(--bad)';
      }
      const t=document.querySelector('.hero-title');
      if(t){
        const online = s.ports.astrbot && s.ports.snowluma && s.ports.reverse_ws && !!s.login;
        const want = online ? '大肥鱼在线' : (s.login ? '有服务掉线了' : 'QQ 掉线了');
        const first=t.firstChild;
        if(first && first.nodeType===3 && first.textContent!==want) first.textContent=want;
        const dot=t.querySelector('.hero-dot');
        if(dot) dot.className='hero-dot '+(online?'on':'off');
      }
      // 连接卡逐项更新，不重建整张卡，所以不闪
      document.querySelectorAll('[data-k]').forEach(function(el){
        const k=el.dataset.k;

async function loadTokenRate(){

    if(window.__tokTimer){ clearInterval(window.__tokTimer); window.__tokTimer=null; }
    return;
  }
  try{
    const d=await j('/api/token_rate');
    document.getElementById('tokAll').textContent=fmtNum(d.all_time);
    document.getElementById('tokToday').textContent=fmtNum(d.today);
    one.textContent=fmtNum(d.per_minute);
    document.getElementById('tok5').textContent=fmtNum(d.last_5m);
  }catch(e){}
}

async function loadContext(){
  const priv=document.getElementById('ctxPrivate');
  const grp=document.getElementById('ctxGroup');
  if(!priv||!grp) return;
  try{
    const d=await j('/api/sessions/stats');
    let p=0, g=0;
    Object.entries(d.items||{}).forEach(function(pair){
      const umo=pair[0], chars=Number(pair[1].chars||0);
      if(umo.indexOf(':FriendMessage:')>=0) p+=chars;
      else if(umo.indexOf(':GroupMessage:')>=0) g+=chars;
    });
    priv.textContent=fmtNum(p)+' 字';
    grp.textContent=fmtNum(g)+' 字';
  }catch(e){}
}

async function loadAccessSync(){
  const box=document.getElementById('accSync');
  if(!box) return;
  try{
    const d=await j('/api/access/status');
    if(d.synced){ box.innerHTML='<span style="color:var(--ok)">已同步</span> · 名单 '+d.expected+' 个会话'; return; }
    let extra='';
    if((d.missing||[]).length) extra+='<br>AstrBot 少：'+esc(d.missing.slice(0,4).join(', '));
    if((d.extra||[]).length) extra+='<br>AstrBot 多：'+esc(d.extra.slice(0,4).join(', '));
    box.innerHTML='<span style="color:var(--warn)">不同步</span> · 名单 '+d.expected+' / AstrBot '+d.actual+extra;
  }catch(e){ box.textContent='读取失败'; }
}

const FAV_KEY='dsh_fav_quick';

function favList(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch(e){ return []; } }
function isFav(plugin,path){ return favList().indexOf(plugin+'|'+path)>=0; }
function toggleFav(plugin,path){
  let f=favList();
  const k=plugin+'|'+path;
  const i=f.indexOf(k);
  if(i>=0) f.splice(i,1); else f.push(k);
  localStorage.setItem(FAV_KEY, JSON.stringify(f));
  renderQuickList();
  toast(i>=0?'已取消收藏':'已收藏，会排到最上面');
}

async function loadQuick(){
  try{ quickData=(await j('/api/quick')).items||[]; }catch(e){ quickData=[]; }
  renderQuickSections();
}

function renderQuickSections(){
  const map={'对话':'qset-dialog','主动消息':'qset-auto','语音':'qset-voice'};
  Object.keys(map).forEach(function(g){
    const box=document.getElementById(map[g]); if(!box) return;
    const items=(quickData||[]).filter(function(it){ return it.group===g; });
    box.innerHTML=items.length?items.map(quickRow).join(''):'<div class="muted" style="padding:8px">没有可调的项</div>';
  });
}

function quickRow(it){
  const pid=it.plugin, path=it.path;
  let ctrl='';
  if(it.type==='bool'){
    ctrl='<input type="checkbox" style="width:auto" '+(it.value?'checked':'')
      +' onchange="saveQuick(\''+pid+'\',\''+path+'\',this.checked,this)">';
  }else if(it.type==='int'){
    ctrl='<input type="number" value="'+(it.value==null?'':it.value)+'" style="width:90px" '
      +'onchange="saveQuick(\''+pid+'\',\''+path+'\',parseInt(this.value||\'0\',10),this)">';
  }else if(it.type==='list' && it.options && it.options.length){
    const cur=it.value||[];
    ctrl='<select multiple size="'+(Math.min(6,Math.max(3,it.options.length)))+'" style="width:340px" '
      +'onchange="saveQuick(\''+pid+'\',\''+path+'\',Array.from(this.selectedOptions).map(function(o){return o.value}),this)">'
      + it.options.map(function(o){
          return '<option value="'+esc(o.value)+'" '+(cur.indexOf(o.value)>=0?'selected':'')+'>'+esc(o.label)+'</option>';
        }).join('')
      +'</select>';
  }else if(it.type==='list'){
    const v=(it.value||[]).join(',');
    ctrl='<input type="text" value="'+String(v).replace(/"/g,'&quot;')+'" style="width:300px" '
      +'onchange="saveQuick(\''+pid+'\',\''+path+'\',this.value.split(\',\').map(function(s){return s.trim()}).filter(Boolean),this)">';
  }else if(it.type==='reply_mode'){
    ctrl='<select onchange="saveQuick(\''+pid+'\',\''+path+'\',this.value,this)">'
      +'<option '+(it.value==='全部消息都接'?'selected':'')+'>全部消息都接</option>'
      +'<option '+(it.value==='只接 / 开头'?'selected':'')+'>只接 / 开头</option></select>';
  }else{
    ctrl='<input type="text" value="'+String(it.value==null?'':it.value).replace(/"/g,'&quot;')+'" '
      +'onchange="saveQuick(\''+pid+'\',\''+path+'\',this.value,this)">';
  }
  const star=isFav(pid,path)?'★':'☆';
  const starColor=isFav(pid,path)?'var(--warn, #f0c36d)':'var(--muted, #7b8ea8)';
  return '<div class="qrow">'
    +'<div class="qlabel"><b>'+esc(it.label)+'</b>'
      +(it.hint?'<div class="muted" style="font-size:11px">'+esc(it.hint)+'</div>':'')+'</div>'
    +'<div class="qctrl">'+ctrl+'</div>'
    +'<button class="qstar" title="收藏" onclick="toggleFav(\''+pid+'\',\''+path+'\')" '
      +'style="color:'+starColor+';background:none;border:none;font-size:18px;cursor:pointer">'+star+'</button>'
    +'</div>';
}

function renderQuickList(){
  const box=document.getElementById('quickset'); if(!box) return;
  const q=(quickFilter||'').trim().toLowerCase();
  const items=(quickData||[]).filter(function(it){
    if(quickFavOnly && !isFav(it.plugin,it.path)) return false;
    if(q){
      const s=((it.label||'')+' '+(it.hint||'')+' '+(it.group||'')).toLowerCase();
      if(s.indexOf(q)<0) return false;
    }
    return true;
  });
  if(!items.length){
    box.innerHTML='<div class="muted" style="padding:16px 0">没有匹配的设置项</div>';
    return;
  }
  const favs=items.filter(function(it){return isFav(it.plugin,it.path)});
  const rest=items.filter(function(it){return !isFav(it.plugin,it.path)});

  let html='';
  if(favs.length){
    html+='<div class="qgroup"><span class="qtag">★ 常用</span></div>'+favs.map(quickRow).join('');
  }
  const groups={};
  rest.forEach(function(it){ (groups[it.group]=groups[it.group]||[]).push(it) });
  Object.keys(groups).forEach(function(g){
    html+='<div class="qgroup"><span class="qtag">'+esc(g)+'</span></div>'
      + groups[g].map(quickRow).join('');
  });
  box.innerHTML=html;
}
async function saveQuick(plugin,path,value,el){
  // 静默保存：不弹重启，只在行内提示，这样多选框按住 Ctrl 连点不会被打断
  try{
    await j('/api/quick',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({plugin:plugin,path:path,value:value})});
    const row=el && el.closest ? el.closest('.qrow') : null;
    if(row){
      let tip=row.querySelector('.qsave');
      if(!tip){ tip=document.createElement('span'); tip.className='qsave'; row.appendChild(tip); }
      tip.innerHTML = plugin==='astrbot_plugin_dafeiyu_voice'
        ? '已保存'
        : '已保存 <a href="javascript:void(0)" onclick="askRestart(\'这项改动要重启才生效\')">重启生效</a>';
    }else{
      toast('已保存');
    }
  }catch(e){ toast('保存失败') }
}

let msgAlign=localStorage.getItem('msgAlign')||'left';
function applyMsgAlign(){
  const box=document.getElementById('msgs');
  if(box) box.style.textAlign=msgAlign;
  const btn=document.getElementById('malign');
  if(btn) btn.textContent='对齐：'+(msgAlign==='left'?'左':msgAlign==='center'?'中':'右');
}
function cycleMsgAlign(){
  msgAlign = msgAlign==='left' ? 'center' : (msgAlign==='center' ? 'right' : 'left');
  localStorage.setItem('msgAlign', msgAlign);
  applyMsgAlign();
}

async function loadMsgs(){
  const ordEl=document.getElementById('morder');
  const ord=ordEl?ordEl.value:'desc';
  const d=await j('/api/messages?lines=300&order='+ord);
  msgCache=d;
  const f1El=document.getElementById('mf1'), f2El=document.getElementById('mf2');
  if(!f1El) return;
  const f1=f1El.value, f2=f2El?f2El.value:'';
  // 首次进入时填充二级菜单（只做一次，避免递归）
  if(f2El && !f2Ready){f2Ready=true; onF1(); return;}
  const rows=d.filter(function(x){
    if(f1!=='all' && x.where!==f1) return false;
    if(f2 && (x.conv||'')!==f2) return false;
    return true;
  });
  const upd=document.getElementById('mupd'); if(upd) upd.textContent='最后更新 '+new Date().toLocaleTimeString('zh-CN');
  const cnt=document.getElementById('mcount');
  if(cnt) cnt.textContent='共 '+rows.length+' 条';
  document.getElementById('msgs').innerHTML=rows.map(function(x){
    const who=x.dir==='in'?(x.sender||'群友'):'大肥鱼';
    const where=(x.where||'')+(x.conv?' · '+x.conv:'');
    const raw=x.text||'';
    const long=raw.length>90 || raw.indexOf('\n')>=0;
    let body='<div class="mtext'+(long?' clamp':'')+'">'+esc(raw)+'</div>';
    if(long){body+='<a href="javascript:void(0)" class="expand" onclick="toggleTxt(this)">展开全文</a>';}
    if(x.image){body+='<div><img class="msgimg" src="/api/image/'+encodeURIComponent(x.image)+'" loading="lazy" onclick="window.open(this.src)"></div>';}
    return '<div style="padding:8px 0;border-bottom:1px solid #0e1420">'
      +'<div class="timehead">'+x.time+'</div>'
      +'<div style="margin-bottom:2px"><span class="tag '+(x.dir==='in'?'in':'out')+'">'+(x.dir==='in'?'收':'发')+'</span><span class="muted">'+where+'</span> <b>'+who+'</b></div>'
      +body+'</div>';
  }).join(''); applyMsgAlign()}

    const cur=(d.current&&d.current.name)?d.current.name:'（未选择）';
    const rows=(d.models||[]).map(x=>{
      const active=(d.current&&d.current.name===x.name)?' style="background:rgba(120,180,255,.12)"':'';
      return `<tr${active}><td><b>${esc(x.name)}</b></td><td class="muted">${esc(x.pth)}</td>
        <td>${x.index?'有':'<span class="muted">无</span>'}</td><td>${x.mb} MB</td>

    }).join('');
    m.innerHTML=bar+`<div class="card"><h3>唱歌模型 <span class="muted">当前：${esc(cur)}</span></h3>
      <div class="muted" style="margin:6px 0 10px">从 ${esc(d.root)}\\models 读取。每个角色一个文件夹，放 .pth，.index 可选。</div>
      <div class="row" style="margin-bottom:8px"><button onclick="loadModels()">重新扫描</button>
        <span class="muted">${d.runtime_ready?'RVC 环境就绪':'RVC 环境未安装'}</span></div>
      <table><tr><th>模型</th><th>权重</th><th>索引</th><th>大小</th><th></th></tr>${rows||'<tr><td colspan=5 class="muted">还没有唱歌模型</td></tr>'}</table>
      <div class="row" style="margin-top:14px">
        <input id="singq" placeholder="试唱一首，填歌名" style="width:220px">
        <button onclick="runSingTest()">试唱</button>
        <span class="muted" id="singstate"></span>
      </div>
      <div id="singout" style="margin-top:10px"></div>
      <div class="muted" style="margin-top:10px">按语言自动选：中文 → ${esc((d.map&&d.map.zh&&d.map.zh.name)||'—')}，日语 → ${esc((d.map&&d.map.ja&&d.map.ja.name)||'—')}。唱歌时先分离人声，再换音色，最后和伴奏混回去。</div></div>`;
    return;
  }
  let d;
  try{ d = await j('/api/models'); }catch(e){ m.innerHTML=bar+'<div class="card">读取模型失败：'+e.message+'</div>'; return; }
  const cur = d.current || {};
  const curName = cur.name || '（未选择）';
  const rows = (d.models||[]).map(x=>{
    const active = (cur.sovits && cur.sovits===x.sovits) ? ' style="background:rgba(120,180,255,.12)"' : '';
    const emo = x.emotion_root ? '有情绪素材' : '无情绪素材';
    return `<tr${active}>
      <td><b>${x.name}</b></td>
      <td class="muted">${x.gpt.split('\\').pop()}</td>
      <td class="muted">${x.sovits.split('\\').pop()}</td>
      <td>${emo}</td>
      <td>${x.heavy?'<span style="color:#e5a13a">大模型·慢</span>':'<span style="color:#5aa469">标准·快</span>'}</td>
      <td><button onclick='switchModel(${JSON.stringify(JSON.stringify(x))})'>切换</button></td>
    </tr>`;
  }).join('');
  m.innerHTML = bar+`<div class="card"><h3>说话模型 <span class="muted">当前：${curName}</span></h3>
    <div class="muted" style="margin:6px 0 10px">从 ${d.root} 读取。把新模型（.ckpt + .pth）放进去，刷新本页就能看到。</div>
    <div class="row" style="margin-bottom:8px"><button onclick="loadModels()">重新扫描</button></div>

  </div>`;
}
async function switchRvc(name){
  if(!confirm('把唱歌模型切换到「'+name+'」？'))return;
  try{
    await j('/api/rvc/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})});
    toast('已切换到 '+name);
    loadModels();
  }catch(e){ toast('切换失败：'+e.message); }
}

async function runSingTest(){
  const q=document.getElementById('singq');
  const st=document.getElementById('singstate');
  const box=document.getElementById('singout');
  const song=((q&&q.value)||'').trim();
  if(!song){ toast('先填歌名'); return; }
  st.textContent='唱中…大概半分钟到一分钟';
  box.innerHTML='';
  try{
    const d=await j('/api/sing_test',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({song:song,seconds:25})});
    if(!d.ok){ st.textContent='失败了'; box.innerHTML='<pre class="muted" style="white-space:pre-wrap">'+esc(d.error||'')+'</pre>'; return; }
    st.textContent='唱完了';
    box.innerHTML='<audio controls src="'+esc(d.url)+'" style="width:100%"></audio>';
  }catch(e){ st.textContent='失败了'; box.innerHTML='<div class="muted">'+esc(e.message)+'</div>'; }
}

async function runPersonaCheck(){
  const box=document.getElementById('pcheck');
  box.innerHTML='<div class="muted">体检中…</div>';
  try{
    const d=await j('/api/persona_check');
    if(d.error){ box.innerHTML='<pre class="muted" style="white-space:pre-wrap">'+esc(d.error)+'</pre>'; return; }
    const lines=(d.findings||[]).slice(0,10).map(function(f){
      return '['+f.level+'] '+f.desc+'：'+String(f.text||'').slice(0,40);
    });
    box.innerHTML='<pre style="white-space:pre-wrap;margin:0">检查 '+d.checked+' 条　ERROR '+d.errors+'　WARN '+d.warns+'\n'+(lines.join('\n')||'没挑出问题')+'</pre>';
  }catch(e){ box.innerHTML='<pre class="muted">失败：'+esc(e.message)+'</pre>'; }
}
async function switchModel(jsonStr){
  const x = JSON.parse(jsonStr);
  if(!confirm('切换到「'+x.name+'」？\n\n会立即加载权重，正在进行的语音可能会中断。'))return;
  toast('切换中，请稍等…');
  try{
    const r = await j('/api/models/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      gpt:x.gpt, sovits:x.sovits, name:x.name, emotion_root:x.emotion_root, ref_audio:x.ref_audio, prompt:x.prompt
    })});
    toast('已切换到 '+x.name + (r.plugin_updated?'（参考素材已更新）':''));
    loadModels();
  }catch(e){ toast('切换失败：'+e.message); }
}

async function openPluginConf(name, btn){
  const body=document.getElementById('pb_'+name);
  if(!body) return;
  const wasOpen=body.style.display!=='none';
  // 一次只展开一个，避免表单 id 冲突
  document.querySelectorAll('.plugbody').forEach(function(el){ el.style.display='none'; });
  document.querySelectorAll('.plug').forEach(function(el){ el.classList.remove('open'); });
  if(wasOpen){ return; }
  body.style.display='block';
  const card=body.closest('.plug'); if(card) card.classList.add('open');

  const d=await j('/api/plugin_schema?name='+encodeURIComponent(name));
  const keys=Object.keys(d.schema||{});
  let form='';
  if(!keys.length){
    form='<div class="muted">这个插件没有可调参数，装好就能用。</div>';
  }else{
    form=keys.map(function(k){
      const it=d.schema[k]||{}; const v=d.values[k]; const t=it.type||'string';
      const label='<div style="margin:12px 0 4px"><b>'+esc(k)+'</b>'
        +' <span class="muted">'+esc(it.description||'')+'</span></div>';
      const hint=it.hint?'<div class="muted" style="font-size:11px">'+esc(it.hint)+'</div>':'';
      let input='';
      if(t==='bool'){
        input='<input type="checkbox" id="pc_'+k+'" '+(v?'checked':'')+' style="width:auto">';
      }else if(t==='int'||t==='float'){
        input='<input type="number" id="pc_'+k+'" value="'+(v===undefined||v===null?'':v)+'" style="width:160px">';
      }else if(t==='list'||t==='object'){
        input='<textarea id="pc_'+k+'" style="min-height:70px">'+esc(JSON.stringify(v,null,2))+'</textarea>';
      }else if(t==='text'){
        input='<textarea id="pc_'+k+'" style="min-height:90px">'+esc(v===undefined?'':String(v))+'</textarea>';
      }else{
        input='<input type="text" id="pc_'+k+'" value="'+esc(v===undefined?'':String(v))+'" style="width:100%">';
      }
      return label+input+hint;
    }).join('');
  }
  body.innerHTML='<div class="muted" style="font-size:11px;margin-bottom:6px">配置文件：'+esc(d.config_path)+'</div>'
    +form
    +'<div class="row" style="margin-top:14px"><button class="primary" onclick="savePluginConf(\''+name+'\')">保存</button>'
    +'<button onclick="openPluginConf(\''+name+'\')">收起</button></div>';
}

async function savePluginConf(name){
  const d=await j('/api/plugin_schema?name='+encodeURIComponent(name));
  const vals={};
  for(const k of Object.keys(d.schema||{})){
    const it=d.schema[k]||{}; const t=it.type||'string';
    const el=document.getElementById('pc_'+k); if(!el) continue;
    if(t==='bool') vals[k]=el.checked;
    else if(t==='int') vals[k]=parseInt(el.value||'0',10);
    else if(t==='float') vals[k]=parseFloat(el.value||'0');
    else if(t==='list'||t==='object'){
      try{ vals[k]=JSON.parse(el.value||'null'); }catch(e){ toast(k+' 不是合法 JSON'); return; }
    }
    else vals[k]=el.value;
  }
  await j('/api/plugin_config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name,values:vals})});
  toast('已保存');
  askRestart('插件「'+name+'」的参数已保存，要重启才生效。');
}

  tokenUsage={private:{},groups:{},members:{},people:{}};
  try{ tokenUsage=(await j('/api/token_usage'))||tokenUsage; }catch(e){}
  const nfHtml = newFriends.length ? ('<div class="card" style="margin-top:12px"><h3>最近新增好友 <span class="muted">有人加了大肥鱼</span></h3>'
    + newFriends.slice(-10).reverse().map(function(x){
        return '<div class="rowline"><span class="avatar">'+esc(String(x.name||'?').slice(0,1))+'</span>'
          +'<div style="flex:1"><div>'+esc(x.name||'')+'</div><div class="muted">'+esc(String(x.user_id))+' · '+esc(x.time||'')+'</div></div></div>';
      }).join('')
    + '<div class="row" style="margin-top:8px"><button class="mini" onclick="clearNewFriends()">清空记录</button></div></div>') : '';
  const tabs=Object.keys(CONTACT_LABELS).map(function(k){
    return '<button data-v="'+k+'" class="'+(contactView===k?'on':'')+'" onclick="setContactView(\''+k+'\')">'+CONTACT_LABELS[k]+'</button>';
  }).join('');
  m.innerHTML=`<div class="row" style="gap:10px;margin-bottom:12px">
      <div class="stat"><b>${d.friends.length}</b><span class="muted">好友</span></div>
      <div class="stat"><b>${d.groups.length}</b><span class="muted">群聊</span></div>
      <div style="flex:1"></div>
      <input id="ctsearch" placeholder="搜名字或号码…" oninput="renderContactLists()" style="width:220px">
      <button onclick="loadContacts()">刷新</button>
    </div>
    ${nfHtml}
    <div class="card" style="margin-top:12px"><h3>名单规则</h3>
      <div class="row" style="justify-content:space-between;padding:4px 0">
        <span>只理白名单里的人或群</span>
        <label class="tgl"><input type="checkbox" id="accmode" onchange="setAccessMode(this.checked)"><span></span></label>
      </div>
      <div class="muted" style="margin-top:6px;font-size:12px">管理员永远放行，黑名单优先。不在白名单的人和群一律不理，新好友和新拉进的群都默认不进名单，得在下面手动加。</div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="seg" id="listview" style="margin-bottom:10px">
        <button data-v="whitelist" class="on" onclick="setListTab('whitelist')">白名单</button>
        <button data-v="blacklist" onclick="setListTab('blacklist')">黑名单</button>
      </div>
      <div id="llist"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="seg" id="cview" style="margin-bottom:10px">${tabs}</div>
      <div id="clist"></div>
    </div>`;
  await loadAccess();
  loadAccessUI();
  renderContactLists();
}

function setContactView(v){
  contactView=v;
  groupView=null;
  friendView=null;
  document.querySelectorAll('#cview button').forEach(function(b){
    b.classList.toggle('on', b.dataset.v===v);
  });
  renderContactLists();
}

function nameOf(kind,id){
  if(kind==='users'){
    const f=(contactData.friends||[]).find(x=>String(x.id)===String(id));
    return f?f.name:('QQ '+id);
  }
  const g=(contactData.groups||[]).find(x=>String(x.id)===String(id));
  return g?g.name:('群 '+id);
}

function accessEntry(kind,id,side){
  return '<div class="rowline"><span class="avatar">'+(kind==='groups'?'群':'人')+'</span>'
    +'<div style="flex:1"><div>'+esc(nameOf(kind,id))+'</div><div class="muted">'+esc(String(id))+'</div></div>'
    +'<button class="mini danger" style="margin-left:0;width:56px" data-kind="'+kind+'" data-id="'+esc(String(id))+'" data-side="'+side+'" onclick="toggleAccess(this)">移出</button></div>';
}

function groupTokens(gid){
  return Number((tokenUsage.groups||{})[String(gid)]||0);
}
function memberTokens(gid,qq){
  const m=(tokenUsage.members||{})[String(gid)]||{};
  return Number(m[String(qq)]||0);
}
function personTokens(qq){
  return Number((tokenUsage.people||{})[String(qq)]||0);
}

function renderContactLists(){
  if(!contactData) return;
  const el=document.getElementById('ctsearch');
  const q=(el&&el.value||'').trim().toLowerCase();
  const match=(name,id)=>!q||String(name||'').toLowerCase().includes(q)||String(id).includes(q);

  const side=listTab;
  const lbox=document.getElementById('llist');
  if(lbox){
    const data=(accessData&&accessData[side])||{users:[],groups:[]};
    const items=[].concat((data.users||[]).map(id=>['users',id]),(data.groups||[]).map(id=>['groups',id]))
      .filter(p=>match(nameOf(p[0],p[1]),p[1]));
    const total=(data.users||[]).length+(data.groups||[]).length;
    const open=listOpen[side];
    const shown=open?items:items.slice(0,5);
    const more=items.length>5;
    lbox.innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:6px">'
      +'<span class="muted">共 '+total+' 个</span><span class="row" style="gap:6px">'
      +(more?'<button class="mini" style="margin-left:0" onclick="toggleList(\''+side+'\')">'+(open?'收起':'展开')+'</button>':'')
      +'<button class="mini" style="margin-left:0" onclick="batchAdd(\''+side+'\')">＋ 批量添加</button></span></div>'
      +(batchSide===side?batchPicker(side):'')
      +'<div class="nlist'+(open?' open':'')+'">'
      +(shown.map(p=>accessEntry(p[0],p[1],side)).join('')
        || '<div class="muted" style="padding:4px 2px">还没有人</div>')
      +'</div>';
  }
  document.querySelectorAll('#listview button').forEach(function(b){
    const d=(accessData&&accessData[b.dataset.v])||{users:[],groups:[]};
    const n=(d.users||[]).length+(d.groups||[]).length;
    b.textContent=(b.dataset.v==='whitelist'?'白名单':'黑名单')+' · '+n;
  });

  const box=document.getElementById('clist');
  if(!box) return;
  if(contactView==='groups' && groupView){ renderGroupDetail(groupView); return; }
  if(contactView==='friends' && friendView){ renderFriendDetail(friendView); return; }
  if(contactView!=='friends'&&contactView!=='groups') return;

  const isFriend=contactView==='friends';
  const sortKey=contactSort==='chars'?'chars':'tokens';
  const statOf=function(x){
    return sessStats['snowluma:'+(isFriend?'FriendMessage':'GroupMessage')+':'+x.id]||null;
  };
  const tokenOf=function(x){
    return isFriend?personTokens(x.id):groupTokens(x.id);
  };
  const rows=(isFriend?contactData.friends:contactData.groups).filter(x=>match(x.name,x.id)).slice().sort(function(a,b){
    const va=sortKey==='tokens'?tokenOf(a):Number((statOf(a)||{}).chars||0);
    const vb=sortKey==='tokens'?tokenOf(b):Number((statOf(b)||{}).chars||0);
    if(va!==vb) return contactDir==='asc' ? va-vb : vb-va;
    return String(a.name||'').localeCompare(String(b.name||''),'zh-CN');
  });
  const mark=function(k){return contactSort===k ? (contactDir==='asc'?' ▲':' ▼') : '';};
  const kind=isFriend?'users':'groups';
  const sideOf=function(id){
    if(!accessData) return '<span class="muted">—</span>';
    const has=function(side){
      const d=accessData[side]||{};
      return (d[kind]||[]).map(String).includes(String(id));
    };
    if(has('blacklist')) return '<span style="color:var(--bad)">黑名单</span>';
    if(has('whitelist')) return '<span style="color:var(--ok)">白名单</span>';
    return '<span class="muted">—</span>';
  };
  const body=rows.map(function(x){
    const st=statOf(x);
    const token=tokenOf(x);
    const act=(isFriend?"openFriend('":"openGroup('")+esc(String(x.id))+"')";
    return '<tr><td style="cursor:pointer" onclick="'+act+'">'+
      '<div class="row" style="gap:8px;align-items:center">'
      +'<span class="avatar">'+(isFriend?esc(String(x.name||'?').slice(0,1)):'群')+'</span>'
      +'<div><div>'+esc(x.name||'')+' <span class="muted">›</span></div><div class="muted" style="font-size:12px">'+esc(String(x.id))+(isFriend?'':' · '+fmt(x.members)+' 人')+'</div></div>'
      +'</div></td>'
      +'<td>'+fmt(token)+'</td>'
      +'<td>'+(st?(fmt(st.chars)+' 字'):'—')+'</td>'
      +'<td>'+sideOf(x.id)+'</td>'
      +'<td style="text-align:right"><button class="mini danger" style="width:80px;height:26px;padding:0;margin-left:0" '
      +(st?('data-cid="'+esc(String(st.id))+'" onclick="clearSess(this.dataset.cid)"'):'disabled')
      +'>清上下文</button></td></tr>';
  }).join('');
  const head='<tr><th>名字</th>'
    +'<th class="thsort'+(contactSort==='tokens'?' cur':'')+'" style="width:110px" onclick="setContactSort(\'tokens\')">累计 token'+mark('tokens')+'</th>'
    +'<th class="thsort'+(contactSort==='chars'?' cur':'')+'" style="width:130px" onclick="setContactSort(\'chars\')">上下文'+mark('chars')+'</th>'
    +'<th style="width:96px">名单</th>'
    +'<th style="width:120px;text-align:right">操作</th></tr>';
  box.innerHTML='<table>'+head+(body||'<tr><td colspan="5" class="muted">没有匹配的</td></tr>')+'</table>';
}

async function clearNewFriends(){
  try{ await j('/api/new_friends/clear',{method:'POST'}); toast('已清空'); loadContacts(); }
  catch(e){ toast('失败：'+e.message); }
}

let groupView=null, friendView=null, allProfiles=[];

async function openGroup(gid){
  groupView=String(gid);
  const box=document.getElementById('clist');
  if(box) box.innerHTML='<div class="muted">读取档案…</div>';
  try{ allProfiles=(await j('/api/profiles')).items||[]; }catch(e){ allProfiles=[]; }
  renderGroupDetail(groupView);
}

function closeGroup(){ groupView=null; renderContactLists(); }

async function openFriend(qq){
  friendView=String(qq);
  const box=document.getElementById('clist');
  if(box) box.innerHTML='<div class="muted">读取档案…</div>';
  try{ allProfiles=(await j('/api/profiles')).items||[]; }catch(e){ allProfiles=[]; }
  renderFriendDetail(friendView);
}

function closeFriend(){ friendView=null; renderContactLists(); }

function renderFriendDetail(qq){
  const box=document.getElementById('clist');
  if(!box) return;
  const f=(contactData.friends||[]).find(function(x){return String(x.id)===String(qq)})||{name:'QQ '+qq};
  const p=allProfiles.find(function(x){return x.qq===String(qq)});
  const st=sessStats['snowluma:FriendMessage:'+qq];
  const gid=(p&&p.groups&&p.groups[0])||'';
  const btn='<button class="mini" style="margin-left:0" onclick="summarizeProfile(\''+esc(gid)+'\',\''+esc(String(qq))+'\')">整理记忆</button>';
  const head='<div class="row" style="justify-content:space-between;margin-bottom:10px">'
    +'<div class="row" style="gap:10px"><button class="mini" style="margin-left:0" onclick="closeFriend()">← 返回</button>'
    +'<b>'+esc(f.name||'')+'</b><span class="muted">'+esc(String(qq))+'</span>'+btn+'</div></div>';
  box.innerHTML=head+(p?personCardHtml(p,{contextChars:st?st.chars:0,totalTokens:personTokens(qq)}):'<div class="muted">还没聊过，没有档案。</div>');
}

async function summarizeProfile(gid,qq){
  try{
    await j('/api/profiles/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gid:gid||'',qq:qq||''})});
    toast('已提交，整理完会自动刷新');
    [15000,40000,80000,120000].forEach(function(ms){ setTimeout(refreshProfilesView, ms); });
  }catch(e){ toast('提交失败：'+e.message); }
}

async function refreshProfilesView(){
  try{ allProfiles=(await j('/api/profiles')).items||[]; }catch(e){ return; }
  if(contactView==='friends' && friendView){ renderFriendDetail(friendView); return; }
  if(contactView==='groups' && groupView){
    const sel=document.getElementById('grpSel');
    const keep=sel?sel.value:'';
    renderGroupDetail(groupView);
    const s=document.getElementById('grpSel');
    if(keep && s){ s.value=keep; loadGroupPerson(); }
  }
}

let groupPeople=[];
function renderGroupDetail(gid){
  const box=document.getElementById('clist');
  if(!box) return;
  const g=(contactData.groups||[]).find(function(x){return String(x.id)===String(gid)})||{name:'群 '+gid,members:0};
  const st=sessStats['snowluma:GroupMessage:'+gid];
  const gToken=groupTokens(gid);
  const inGroupList=function(side){
    const d=(accessData&&accessData[side])||{};
    return (d.groups||[]).map(String).includes(String(gid));
  };
  const groupTag=inGroupList('blacklist')?'<span style="color:var(--bad)">本群在黑名单</span>':(inGroupList('whitelist')?'<span style="color:var(--ok)">本群在白名单</span>':'<span class="muted">本群未加入名单</span>');
  groupPeople=allProfiles.filter(function(p){return (p.groups||[]).map(String).includes(String(gid))})
    .sort(function(a,b){return memberTokens(gid,b.qq)-memberTokens(gid,a.qq)||(b.msg_count||0)-(a.msg_count||0)});
  const head='<div class="row" style="justify-content:space-between;margin-bottom:10px">'
    +'<div class="row" style="gap:10px"><button class="mini" style="margin-left:0" onclick="closeGroup()">← 返回</button>'
    +'<b>'+esc(g.name||'')+'</b><span class="muted">'+esc(String(gid))+' · '+fmt(g.members)+' 人 · 本群上下文 '+fmt(st?st.chars:0)+' 字 · 本群累计 ≈'+fmt(gToken)+' token</span> '+groupTag
    +'<button class="mini" style="margin-left:0" onclick="summarizeProfile(\''+esc(String(gid))+'\',\'\')">整理记忆</button></div>'
    +'</div>';
  const options=groupPeople.map(function(p){
    return '<option value="'+esc(p.qq)+'">'+esc(p.alias||p.name)+'（'+esc(p.qq)+'） · 本群 ≈'+fmt(memberTokens(gid,p.qq))+' token</option>';
  }).join('');
  const picker=groupPeople.length
    ? '<div class="row" style="gap:10px;margin-bottom:10px"><span class="muted" style="flex:none">选择群友</span><select id="grpSel" style="flex:1;min-width:260px" onchange="loadGroupPerson()">'+options+'</select></div><div id="grpCard"></div>'
    : '<div class="muted">这个群还没有聊过天的人。</div>';
  box.innerHTML=head+picker;
  if(groupPeople.length) loadGroupPerson();
}

function loadGroupPerson(){
  const sel=document.getElementById('grpSel');
  const box=document.getElementById('grpCard');
  if(!sel||!box) return;
  const p=groupPeople.find(function(x){return x.qq===sel.value});
  const st=sessStats['snowluma:GroupMessage:'+groupView];
  box.innerHTML=p?personCardHtml(p,{sharedChars:st?st.chars:0,groupTokens:memberTokens(groupView,p.qq),totalTokens:personTokens(p.qq)}):'';
}

function personCardHtml(p, meta){
  meta=meta||{};
  const likes=esc(p.likes||'').trim();
  const notes=esc(p.notes||'').trim();
  const tokenLine=meta.groupTokens!=null
    ? '本群上下文 '+fmt(meta.sharedChars||0)+' 字 · 本群累计 ≈'+fmt(meta.groupTokens)+' token · 总计 ≈'+fmt(meta.totalTokens||0)+' token'
    : '当前上下文 '+fmt(meta.contextChars||0)+' 字 · 总计 ≈'+fmt(meta.totalTokens||0)+' token';
  return '<div class="pcard">'
    +'<div class="row" style="justify-content:space-between;gap:8px">'
    +'<div class="row" style="gap:8px"><span class="avatar">'+esc(String(p.alias||p.name||'?').slice(0,1))+'</span>'
    +'<div><b>'+esc(p.alias||p.name)+'</b> <span class="muted">'+esc(p.qq)+'</span>'
    +'<div class="muted" style="font-size:12px">'+esc(p.relation)+' · '+p.msg_count+' 条 · '+fmt(p.chars)+' 字 · '+tokenLine+' · 最后 '+esc(p.last_seen||'—')+'</div></div></div>'
    +'</div>'
    +'<div class="muted" style="margin:10px 0 2px">喜好</div>'
    +'<div>'+(likes||'<span class="muted">还没记</span>')+'</div>'
    +'<div class="muted" style="margin:10px 0 2px">印象</div>'
    +'<div>'+(notes||'<span class="muted">还没记</span>')+'</div>'
    +'</div>';
}

let accessData=null;

async function loadAccess(){
  try{ accessData=await j('/api/access'); }catch(e){}
  return accessData;
}

function batchPicker(side){
  if(!contactData) return '';
  const has=function(s,kind,id){
    const d=(accessData&&accessData[s])||{};
    return (d[kind]||[]).map(String).includes(String(id));
  };
  const line=function(kind,id,name){
    const white=has('whitelist',kind,id), black=has('blacklist',kind,id);
    const inTarget=(side==='whitelist'?white:black), inOther=(side==='whitelist'?black:white);
    const tag=white?'<span style="color:var(--ok)">白名单</span>':(black?'<span style="color:var(--bad)">黑名单</span>':'<span class="muted">未加入</span>');
    const note=inTarget?' · 已在本名单':(inOther?' · 加入后会从'+(side==='whitelist'?'黑名单':'白名单')+'移出':'');
    return '<label style="display:block;padding:3px 2px'+(inTarget?' opacity:.55':'')+'"><input type="checkbox" class="bchk" data-kind="'+kind+'" value="'+esc(String(id))+'" style="width:auto" '+(inTarget?'disabled':'')+'> '
      +esc(name||'')+' · '+esc(String(id))+' · '+tag+note+'</label>';
  };
  const friends=(contactData.friends||[]).map(f=>line('users',f.id,f.name)).join('') || '<div class="muted">没有好友</div>';
  const groups=(contactData.groups||[]).map(g=>line('groups',g.id,g.name)).join('') || '<div class="muted">没有群聊</div>';
  return '<div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px"><div style="margin-bottom:4px">加入'+(side==='whitelist'?'白名单':'黑名单')+'</div>'
    +'<div class="muted" style="margin:6px 0 2px">好友</div>'+friends
    +'<div class="muted" style="margin:8px 0 2px">群聊</div>'+groups
    +'<div class="row" style="margin-top:8px"><button class="primary" onclick="confirmBatch(\''+side+'\')">加入</button>'
    +'<button onclick="batchAdd(\''+side+'\')">取消</button></div></div>';
}

function batchAdd(side){
  batchSide = batchSide===side ? '' : side;
  renderContactLists();
}

async function confirmBatch(side){
  const byKind={users:[],groups:[]};
  Array.from(document.querySelectorAll('.bchk:checked')).forEach(function(x){
    const k=x.dataset.kind==='groups'?'groups':'users';
    byKind[k].push(x.value);
  });
  const total=byKind.users.length+byKind.groups.length;
  if(!total){ toast('先勾几个人'); return; }
  try{
    let added=0;
    for(const kind of ['users','groups']){
      if(!byKind[kind].length) continue;
      const r=await j('/api/access/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side:side,kind:kind,ids:byKind[kind]})});
      added += (r.added||0);
    }
    toast('已加入 '+added+' 个');
    batchSide='';
    await loadAccess(); renderContactLists();
  }catch(e){ toast('失败：'+e.message); }
}

async function toggleAccess(btn){
  const kind=btn.dataset.kind, id=String(btn.dataset.id), side=btn.dataset.side;
  const on=!((accessData[side]&&accessData[side][kind])||[]).map(String).includes(id);
  try{
    await j('/api/access/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side:side,kind:kind,id:id,on:on})});
    await loadAccess(); renderContactLists();
    toast(on?(side==='whitelist'?'已加白名单':'已拉黑'):'已移出名单');
  }catch(e){ toast('失败：'+e.message); }
}

async function loadAccessUI(){
  const d=await loadAccess();
  const m=document.getElementById('accmode');
  if(m) m.checked=d.mode==='whitelist';
}

async function setAccessMode(on){
  try{ await j('/api/access/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:on?'whitelist':'all'})});
    toast(on?'只理白名单了':'恢复理所有人了'); loadAccessUI();
  }catch(e){ toast('失败：'+e.message); }
}

async function loadPersonaHistory(){
  const box=document.getElementById('phist'); if(!box) return;
  box.innerHTML='<div class="muted">读取历史…</div>';
  try{
    const d=await j('/api/persona/history');
    const items=(d.items||[]).slice(0,15);
    if(!items.length){ box.innerHTML='<div class="muted">还没有历史版本，改一次保存就有了。</div>'; return; }
    box.innerHTML=items.map(function(x){
      const t=new Date((x.ts||0)*1000).toLocaleString();
      return '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid #0e1420">'
        +'<div><div>'+esc(t)+'</div><div class="muted">'+esc(x.preview||'')+' · '+x.chars+' 字</div></div>'
        +'<button class="mini" data-idx="'+x.idx+'" onclick="restorePersona(this)">恢复这一版</button></div>';
    }).join('');
  }catch(e){ box.innerHTML='<div class="muted">读取失败：'+esc(e.message)+'</div>'; }
}

async function restorePersona(btn){
  if(!confirm('恢复这一版？当前这版会先存进历史，不会丢。')) return;
  try{
    const r=await j('/api/persona/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idx:parseInt(btn.dataset.idx,10)})});
    toast(r.msg||'已恢复'); loadPersona(); loadPersonaHistory();
  }catch(e){ toast('失败：'+e.message); }
}

async function loadPersona(){const p=await j('/api/persona');document.getElementById('ptext').value=p.prompt;document.getElementById('pmeta').textContent=`（${p.id}，${p.prompt.length} 字）`}

let nOrder='new';
async function toggleNOrder(){
  nOrder = nOrder==='new' ? 'old' : 'new';
  const b=document.getElementById('norderbtn');
  if(b) b.textContent = nOrder==='new' ? '排序：最新在上' : '排序：最早在上';
  await loadNetease();
}

async function loadNetease(){
  try{
    const d=await j('/api/netease');
    const st=d.status||{};
    document.getElementById('nstatus').innerHTML = st.ok
      ? '<i class="dot on"></i> '+esc(st.nickname||'')+'（'+esc(st.uid)+'）'+(st.vip?' · 会员':'')
      : '<i class="dot off"></i> 未登录'+(st.error?'：'+esc(st.error):'');
    const sel=document.getElementById('npl');
    sel.innerHTML=(d.playlists||[]).map(function(p){
      const on=(d.target&&d.target.id===p.id)?' selected':'';
      return '<option value="'+p.id+'"'+on+'>'+esc(p.name)+'（'+(p.count||0)+'）</option>';
    }).join('') || '<option value="">（没有歌单）</option>';
    document.getElementById('ntarget').textContent = (d.target&&d.target.name) ? '当前：'+d.target.name : '还没选收藏歌单';
    const c=await j('/api/netease/collected?limit=50');
    const items=(c.items||[]).map(function(it,i){ return {it:it, i:i}; }).sort(function(a,b){
      if(a.it.time===b.it.time) return a.i-b.i;
      if(nOrder==='new') return a.it.time < b.it.time ? 1 : -1;
      return a.it.time < b.it.time ? -1 : 1;
    }).map(function(x){ return x.it; });
    document.getElementById('ncount').textContent = items.length ? ('（'+items.length+' 条）') : '';
    if(!items.length){
      document.getElementById('nbox').innerHTML='<div class="muted" style="padding:10px">还没有收藏记录。让大肥鱼推荐一首试试，它会自动标风格和介绍。</div>';
      return;
    }
    let html='', lastTime='';
    items.forEach(function(it){
      if(it.time !== lastTime){
        lastTime = it.time;
        html += '<div class="timehead" style="margin:14px 0 4px">'+esc(it.time||'')+'</div>';
      }
      const tags=String(it.style||'').split(/[\/,， ]+/).filter(Boolean).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
      const badge=it.added?'<span class="tag" style="color:#5aa469;border-color:#2c5a3f">已进歌单</span>':'';
      html += '<div style="padding:8px 6px;border-bottom:1px solid #0e1420">'
        +'<div style="font-size:14px"><b>'+esc(it.name||'')+'</b> <span class="muted">'+esc(it.artists||'')+'</span></div>'
        +(it.intro?'<div class="muted" style="margin-top:4px">'+esc(it.intro)+'</div>':'')
        +'<div style="margin-top:5px">'+tags+badge+'</div></div>';
    });
    document.getElementById('nbox').innerHTML=html;
  }catch(e){ document.getElementById('nstatus').innerHTML='<i class="dot off"></i> 读取失败：'+esc(e.message); }
}

function toggleCookieBox(){
  const b=document.getElementById('ncookiebox');
  b.style.display = (b.style.display==='none'||!b.style.display) ? 'block' : 'none';
}

async function saveNetCookie(){
  const el=document.getElementById('ncookie');
  const c=(el&&el.value||'').trim();
  if(!c){ toast('先粘 cookie'); return; }
  try{
    const r=await j('/api/netease/cookie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookie:c})});
    toast(r.ok?('已登录：'+(r.nickname||'')):('登录失败：'+(r.error||'')));
    el.value='';
    loadNetease();
  }catch(e){ toast('保存失败：'+e.message); }
}

async function saveNetTarget(){
  const sel=document.getElementById('npl');
  if(!sel||!sel.value){ toast('先选歌单'); return; }
  const name=sel.options[sel.selectedIndex].text.replace(/（\d+）$/,'');
  try{
    await j('/api/netease/target',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:parseInt(sel.value,10),name:name})});
    toast('收藏歌单已设置');
    loadNetease();
  }catch(e){ toast('设置失败：'+e.message); }
}

let qrTimer=null;
async function startQrLogin(){
  try{
    const d=await j('/api/netease/qr');
    if(!d.ok){ toast('获取二维码失败：'+(d.error||'')); return; }
    const img=document.getElementById('nqr');
    const st=document.getElementById('nqrstate');
    img.style.display='block';
    img.src='/api/netease/qr.png?t='+Date.now();
    st.textContent='用网易云 App 扫码';
    if(qrTimer) clearInterval(qrTimer);
    qrTimer=setInterval(async function(){
      try{
        const r=await j('/api/netease/qr/status');
        if(r.msg) st.textContent=r.msg;
        if(r.code===803){
          clearInterval(qrTimer); qrTimer=null;
          if(r.msg==='登录成功'){ img.style.display='none'; loadNetease(); }
        } else if(r.code===800){
          clearInterval(qrTimer); qrTimer=null;
        }
      }catch(e){}
    }, 2000);
  }catch(e){ toast('失败：'+e.message); }
}

async function savePersona(){const prompt=document.getElementById('ptext').value;const r=await j('/api/persona',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});toast(r.msg)}

const MOOD_CN={happy:'开心',sad:'难过',angry:'生气',shy:'害羞',confused:'疑惑',hungry:'饿'};
async function loadStickers(){const d=await j('/api/stickers');const total=Object.values(d).reduce((a,b)=>a+b.length,0);document.getElementById('smeta').textContent=`（共 ${total} 张）`;
  document.getElementById('sbox').innerHTML=Object.entries(d).map(([mood,files])=>`<div class="mooddrop" data-mood="${esc(mood)}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropStickers(event,this)"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${esc(MOOD_CN[mood]||mood)} <span class="muted" style="font-size:11px">${files.length} 张</span></span><span class="row" style="gap:6px"><button class="mini" onclick="event.stopPropagation();pickStickers('${esc(mood)}')">导入</button><button class="mini" onclick="event.stopPropagation();toggleMood(this)">展开</button></span></div><div class="thumbs">${files.map(f=>`<img draggable="false" loading="lazy" src="/api/sticker/${encodeURIComponent(mood)}/${encodeURIComponent(f)}">`).join('')}</div></div>`).join('')}
function toggleMood(btn){const box=btn.closest('.mooddrop');box.classList.toggle('open');btn.textContent=box.classList.contains('open')?'收起':'展开';}

async function uploadStickers(mood, files){
  let ok=0;
  for(const f of files){
    if(!f.type || !f.type.startsWith('image/')) continue;
    const fd=new FormData(); fd.append('mood',mood); fd.append('file',f);
    try{ const r=await fetch('/api/stickers/upload',{method:'POST',body:fd}); if(r.ok) ok++; }catch(e){}
  }
  toast('已导入 '+ok+' 张到 '+mood);
  loadStickers();
}
function pickStickers(mood){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=function(){ uploadStickers(mood, Array.from(inp.files||[])); };
  inp.click();
}
function dropStickers(ev, el){
  ev.preventDefault(); ev.stopPropagation(); el.classList.remove('over');
  const mood=el.dataset.mood;
  const files=Array.from(ev.dataTransfer.files||[]);
  uploadStickers(mood, files);
}

async function loadLog(name){curLog=name;const r=await j(`/api/logs?name=${name}&lines=200`);const b=document.getElementById('lbox');if(b){b.textContent=r.content;b.scrollTop=b.scrollHeight}}
async function markLogSeen(){
  try{const s=await j('/api/logs/seen',{method:'POST'});const tip=document.getElementById('errTip');if(tip){tip.textContent=s.cleared?('刚把 '+s.cleared+' 条错误标成已读，红点只提醒之后的新错误。'):'最近没有新的日志错误。';}updateBadges();}catch(e){}
}
function toggleFollow(){follow=!follow;document.getElementById('fbtn').textContent='自动刷新：'+(follow?'开':'关')}

async function act(name){try{const r=await j('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});toast(r.msg||'已执行')}catch(e){toast('操作失败')}}

function sizeText(n){if(!n)return '—';if(n>=1073741824)return (n/1073741824).toFixed(1)+' GB';if(n>=1048576)return Math.round(n/1048576)+' MB';return Math.max(1,Math.round(n/1024))+' KB'}

async function loadBackup(){
  if(!document.getElementById('bakTime')) return;
  try{
    const d=await j('/api/backup/status');
    let when='还没有';
    if(d.latest){
      const t=new Date(d.latest.mtime*1000);
      const p=n=>String(n).padStart(2,'0');
      when=`${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
    }
    document.getElementById('bakTime').textContent=when;
    document.getElementById('bakSize').textContent=d.latest?sizeText(d.latest.size):'—';
    document.getElementById('bakCount').textContent=(d.count||0)+' 份';
    const btn=document.getElementById('bakBtn'), msg=document.getElementById('bakMsg');
    window.__bakRunning=!!d.running;
    if(d.running){
      btn.disabled=true; btn.textContent='备份中…'; msg.textContent='正在打包，约一分钟';
    }else{
      btn.disabled=false; btn.textContent='立即备份';
      msg.textContent = d.ok===false ? ('上次失败：'+(d.error||'未知错误')) : '';
    }
  }catch(e){}
}

async function backupNow(){
  try{
    const r=await j('/api/backup',{method:'POST'});
    toast(r.msg||'备份已开始');
    if(window.__bakTimer) clearInterval(window.__bakTimer);
    window.__bakTimer=setInterval(async()=>{
      if(!document.getElementById('bakBtn')){
        clearInterval(window.__bakTimer); window.__bakTimer=null; return;
      }
      const was=window.__bakRunning;
      await loadBackup();
      if(!window.__bakRunning){
        clearInterval(window.__bakTimer); window.__bakTimer=null;
        if(was) toast('备份完成，点「查看备份」');
      }
    },2000);
    await loadBackup();
  }catch(e){toast('备份启动失败：'+e.message)}
}

setInterval(refresh,3000);
setInterval(()=>{if(curTab==='消息流'){const doc=document.documentElement;const near=window.innerHeight+window.scrollY>=doc.scrollHeight-240;if(near) loadMsgs();}else if(curTab==='日志'&&follow)loadLog(curLog)},4000);
refresh();render();
</script>
